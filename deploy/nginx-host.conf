# Đặt vào /etc/nginx/sites-available/07nghiep.site (symlink sang sites-enabled). Cần cert: certbot certonly --nginx -d 07nghiep.site
server {
    listen 80;
    server_name 07nghiep.site;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name 07nghiep.site;
    ssl_certificate     /etc/letsencrypt/live/07nghiep.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/07nghiep.site/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
