<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" role="img" aria-label="Người Hóa Sói">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131c31"/>
      <stop offset="55%" stop-color="#26344f"/>
      <stop offset="100%" stop-color="#0b101d"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b101d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04050a" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e0a5"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#8b6528"/>
    </linearGradient>
    <clipPath id="innerClip">
      <rect x="14" y="14" width="292" height="412" rx="14"/>
    </clipPath>
  </defs>

  <rect width="320" height="440" rx="18" fill="#090b12"/>
  <g clip-path="url(#innerClip)">
    <rect x="14" y="14" width="292" height="412" fill="url(#bg)"/>
    <rect x="14" y="14" width="292" height="412" fill="url(#aura)"/>
    
  <g fill="#f5e7c4" opacity="0.7">
    <circle cx="54" cy="58" r="1.5"/><circle cx="92" cy="44" r="1"/>
    <circle cx="246" cy="52" r="1.6"/><circle cx="268" cy="84" r="1.1"/>
    <circle cx="64" cy="112" r="1"/><circle cx="232" cy="118" r="1.2"/>
    <circle cx="132" cy="48" r="1.1"/><circle cx="198" cy="42" r="1.4"/>
  </g>

        <!-- Half-eclipsed moon -->
        <circle cx="160" cy="144" r="68" fill="#fef3c7" opacity="0.9"/>
        <path d="M160 76 A68 68 0 0 1 160 212 Z" fill="#7f1d1d" opacity="0.82"/>
        
  <g fill="#080c14" opacity="0.92">
    <polygon points="14,426 42,315 70,426"/>
    <polygon points="48,426 80,335 112,426"/>
    <polygon points="212,426 244,330 276,426"/>
    <polygon points="252,426 284,308 310,426"/>
    <rect x="14" y="388" width="292" height="40"/>
  </g>

    
        <!-- Split Duality Portrait: Left Villager, Right Wolf Shadow -->
        <line x1="160" y1="120" x2="160" y2="394" stroke="#f5b841" stroke-width="2" stroke-dasharray="5 5" opacity="0.7"/>
        <!-- Left half: calm human profile -->
        <path d="M90 398 C96 320 122 284 160 284 L160 398 Z" fill="#1e3a5f" stroke="#93c5fd" stroke-width="2"/>
        <path d="M160 190 A36 36 0 0 0 160 262 Z" fill="#e6c39a"/>
        <circle cx="144" cy="222" r="4" fill="#0f172a"/>
        <!-- Right half: looming werewolf silhouette -->
        <path d="M160 284 C198 284 228 320 238 398 L160 398 Z" fill="#180a0f" stroke="#f87171" stroke-width="2"/>
        <path d="M160 184 L184 202 L212 152 L216 226 L196 276 L160 284 Z" fill="#1a0b10" stroke="#f87171" stroke-width="2"/>
        <polygon points="196,216 172,224 188,232" fill="#fde047"/>
        <polygon points="168,256 174,274 180,256" fill="#f8fafc"/>
        
    <rect x="14" y="14" width="292" height="412" fill="url(#vignette)"/>
  </g>

  <!-- Ornate gothic border -->
  <rect x="10" y="10" width="300" height="420" rx="16" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="18" y="18" width="284" height="404" rx="11" fill="none" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.55"/>
  <!-- Corner filigree diamonds -->
  <g fill="url(#gold)" opacity="0.9">
    <polygon points="26,26 32,20 38,26 32,32"/>
    <polygon points="282,26 288,20 294,26 288,32"/>
    <polygon points="26,414 32,408 38,414 32,420"/>
    <polygon points="282,414 288,408 294,414 288,420"/>
  </g>
</svg>
