<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" role="img" aria-label="Tay Sai">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b0b24"/>
      <stop offset="55%" stop-color="#361233"/>
      <stop offset="100%" stop-color="#0e0614"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#a21caf" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#a21caf" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0e0614" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04050a" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e0a5"/>
      <stop offset="50%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#8b6528"/>
    </linearGradient>
    <clipPath id="innerClip">
      <rect x="14" y="14" width="292" height="412" rx="14"/>
    </clipPath>
  </defs>

  <rect width="320" height="440" rx="18" fill="#090b12"/>
  <g clip-path="url(#innerClip)">
    <rect x="14" y="14" width="292" height="412" fill="url(#bg)"/>
    <rect x="14" y="14" width="292" height="412" fill="url(#aura)"/>
    
  <g fill="#f5e7c4" opacity="0.7">
    <circle cx="54" cy="58" r="1.5"/><circle cx="92" cy="44" r="1"/>
    <circle cx="246" cy="52" r="1.6"/><circle cx="268" cy="84" r="1.1"/>
    <circle cx="64" cy="112" r="1"/><circle cx="232" cy="118" r="1.2"/>
    <circle cx="132" cy="48" r="1.1"/><circle cx="198" cy="42" r="1.4"/>
  </g>

        <circle cx="160" cy="170" r="82" fill="#701a75" opacity="0.32"/>
        <!-- Shadow wolf silhouette behind minion -->
        <path d="M88 188 L112 104 L144 152 L176 152 L208 104 L232 188 Z" fill="#1f0722" opacity="0.65"/>
    
        <!-- Hooded Cultist/Minion -->
        <path d="M72 414 C82 320 112 276 160 276 C208 276 238 320 248 414 Z" fill="#1a0d22" stroke="#c084fc" stroke-width="2"/>
        <path d="M110 280 C108 198 130 156 160 150 C190 156 212 198 210 280 Z" fill="#241130" stroke="#d97757" stroke-width="2"/>
        <ellipse cx="160" cy="222" rx="32" ry="42" fill="#09040d"/>
        <!-- Sly glowing eyes under hood -->
        <path d="M142 218 L154 222 L144 226 Z" fill="#f43f5e"/>
        <path d="M178 218 L166 222 L176 226 Z" fill="#f43f5e"/>
        <!-- Curved dagger -->
        <path d="M214 256 C244 278 248 318 220 352 C228 322 224 294 202 274 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
        <rect x="196" y="254" width="22" height="8" rx="3" transform="rotate(-38 207 258)" fill="#d9b56c"/>
        <!-- Wolf pendant -->
        <circle cx="160" cy="326" r="18" fill="#450a0a" stroke="#f5b841" stroke-width="2.5"/>
        <polygon points="152,320 160,336 168,320" fill="#f5b841"/>
        
    <rect x="14" y="14" width="292" height="412" fill="url(#vignette)"/>
  </g>

  <!-- Ornate gothic border -->
  <rect x="10" y="10" width="300" height="420" rx="16" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="18" y="18" width="284" height="404" rx="11" fill="none" stroke="#d97757" stroke-width="1" stroke-opacity="0.55"/>
  <!-- Corner filigree diamonds -->
  <g fill="url(#gold)" opacity="0.9">
    <polygon points="26,26 32,20 38,26 32,32"/>
    <polygon points="282,26 288,20 294,26 288,32"/>
    <polygon points="26,414 32,408 38,414 32,420"/>
    <polygon points="282,414 288,408 294,414 288,420"/>
