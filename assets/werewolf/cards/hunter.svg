<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" role="img" aria-label="Thợ Săn">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2419"/>
      <stop offset="55%" stop-color="#343b24"/>
      <stop offset="100%" stop-color="#10140d"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#a3e635" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10140d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04050a" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e0a5"/>
      <stop offset="50%" stop-color="#d9a959"/>
      <stop offset="100%" stop-color="#8b6528"/>
    </linearGradient>
    <clipPath id="innerClip">
      <rect x="14" y="14" width="292" height="412" rx="14"/>
    </clipPath>
  </defs>

  <rect width="320" height="440" rx="18" fill="#090b12"/>
  <g clip-path="url(#innerClip)">
    <rect x="14" y="14" width="292" height="412" fill="url(#bg)"/>
    <rect x="14" y="14" width="292" height="412" fill="url(#aura)"/>
    
  <g fill="#f5e7c4" opacity="0.7">
    <circle cx="54" cy="58" r="1.5"/><circle cx="92" cy="44" r="1"/>
    <circle cx="246" cy="52" r="1.6"/><circle cx="268" cy="84" r="1.1"/>
    <circle cx="64" cy="112" r="1"/><circle cx="232" cy="118" r="1.2"/>
    <circle cx="132" cy="48" r="1.1"/><circle cx="198" cy="42" r="1.4"/>
  </g>

        <circle cx="236" cy="96" r="32" fill="#e2e8f0" opacity="0.78"/>
        
  <g fill="#080c14" opacity="0.92">
    <polygon points="14,426 42,315 70,426"/>
    <polygon points="48,426 80,335 112,426"/>
    <polygon points="212,426 244,330 276,426"/>
    <polygon points="252,426 284,308 310,426"/>
    <rect x="14" y="388" width="292" height="40"/>
  </g>

    
        <!-- Heavy Medieval Crossbow -->
        <path d="M62 184 Q160 118 258 184" fill="none" stroke="#a16207" stroke-width="11" stroke-linecap="round"/>
        <path d="M62 184 L160 248 L258 184" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
        <!-- Crossbow stock -->
        <rect x="150" y="136" width="20" height="222" rx="6" fill="#451a03" stroke="#d9a959" stroke-width="2.2"/>
        <!-- Silver bolt -->
        <line x1="160" y1="84" x2="160" y2="250" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
        <polygon points="160,64 146,102 160,92 174,102" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <!-- Fletching -->
        <polygon points="160,224 142,248 160,242" fill="#ef4444"/>
        <polygon points="160,224 178,248 160,242" fill="#ef4444"/>
        <!-- Targeting crosshair aura -->
        <circle cx="160" cy="146" r="46" fill="none" stroke="#facc15" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.7"/>
        
    <rect x="14" y="14" width="292" height="412" fill="url(#vignette)"/>
  </g>

  <!-- Ornate gothic border -->
  <rect x="10" y="10" width="300" height="420" rx="16" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="18" y="18" width="284" height="404" rx="11" fill="none" stroke="#d9a959" stroke-width="1" stroke-opacity="0.55"/>
  <!-- Corner filigree diamonds -->
  <g fill="url(#gold)" opacity="0.9">
    <polygon points="26,26 32,20 38,26 32,32"/>
    <polygon points="282,26 288,20 294,26 288,32"/>
    <polygon points="26,414 32,408 38,414 32,420"/>
    <polygon points="282,414 288,408 294,414 288,420"/>
  </g>
</svg>
