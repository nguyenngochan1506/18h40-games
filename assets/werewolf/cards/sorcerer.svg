<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" role="img" aria-label="Pháp Sư Hắc Ám">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120829"/>
      <stop offset="55%" stop-color="#2a1252"/>
      <stop offset="100%" stop-color="#090418"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090418" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04050a" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e0a5"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#8b6528"/>
    </linearGradient>
    <clipPath id="innerClip">
      <rect x="14" y="14" width="292" height="412" rx="14"/>
    </clipPath>
  </defs>

  <rect width="320" height="440" rx="18" fill="#090b12"/>
  <g clip-path="url(#innerClip)">
    <rect x="14" y="14" width="292" height="412" fill="url(#bg)"/>
    <rect x="14" y="14" width="292" height="412" fill="url(#aura)"/>
    
  <g fill="#f5e7c4" opacity="0.7">
    <circle cx="54" cy="58" r="1.5"/><circle cx="92" cy="44" r="1"/>
    <circle cx="246" cy="52" r="1.6"/><circle cx="268" cy="84" r="1.1"/>
    <circle cx="64" cy="112" r="1"/><circle cx="232" cy="118" r="1.2"/>
    <circle cx="132" cy="48" r="1.1"/><circle cx="198" cy="42" r="1.4"/>
  </g>

        <!-- Arcane rings -->
        <circle cx="160" cy="186" r="96" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
        <circle cx="160" cy="186" r="76" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.45"/>
        <!-- Lightning arcs -->
        <path d="M74 128 L104 152 L92 164 L124 196" fill="none" stroke="#e879f9" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M246 128 L216 152 L228 164 L196 196" fill="none" stroke="#e879f9" stroke-width="2.5" stroke-linecap="round"/>
    
        <!-- Dark Sorcerer robes & horned hood -->
        <path d="M70 416 C82 326 112 288 160 288 C208 288 238 326 250 416 Z" fill="#160a2e" stroke="#a855f7" stroke-width="2"/>
        <path d="M114 276 L132 146 L160 116 L188 146 L206 276 Z" fill="#1f0e3d" stroke="#c084fc" stroke-width="2"/>
        <ellipse cx="160" cy="204" rx="28" ry="34" fill="#080312"/>
        <circle cx="150" cy="202" r="3.5" fill="#e879f9"/>
        <circle cx="170" cy="202" r="3.5" fill="#e879f9"/>
        <!-- Dark Crystal Orb with crimson eye -->
        <circle cx="160" cy="316" r="42" fill="#2e1065" stroke="#c084fc" stroke-width="2.5"/>
        <circle cx="160" cy="316" r="32" fill="#581c87" opacity="0.7"/>
        <path d="M134 316 Q160 296 186 316 Q160 336 134 316 Z" fill="#f43f5e"/>
        <ellipse cx="160" cy="316" rx="5" ry="12" fill="#09040f"/>
        
    <rect x="14" y="14" width="292" height="412" fill="url(#vignette)"/>
  </g>

  <!-- Ornate gothic border -->
  <rect x="10" y="10" width="300" height="420" rx="16" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="18" y="18" width="284" height="404" rx="11" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.55"/>
  <!-- Corner filigree diamonds -->
  <g fill="url(#gold)" opacity="0.9">
    <polygon points="26,26 32,20 38,26 32,32"/>
    <polygon points="282,26 288,20 294,26 288,32"/>
    <polygon points="26,414 32,408 38,414 32,420"/>
    <polygon points="282,414 288,408 294,414 288,420"/>
  </g>
