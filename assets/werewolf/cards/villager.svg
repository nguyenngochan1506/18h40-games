<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" role="img" aria-label="Dân Làng">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2d47"/>
      <stop offset="55%" stop-color="#2b425c"/>
      <stop offset="100%" stop-color="#131c28"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#e7b96b" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#e7b96b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#131c28" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04050a" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e0a5"/>
      <stop offset="50%" stop-color="#d9b56c"/>
      <stop offset="100%" stop-color="#8b6528"/>
    </linearGradient>
    <clipPath id="innerClip">
      <rect x="14" y="14" width="292" height="412" rx="14"/>
    </clipPath>
  </defs>

  <rect width="320" height="440" rx="18" fill="#090b12"/>
  <g clip-path="url(#innerClip)">
    <rect x="14" y="14" width="292" height="412" fill="url(#bg)"/>
    <rect x="14" y="14" width="292" height="412" fill="url(#aura)"/>
    
  <g fill="#f5e7c4" opacity="0.7">
    <circle cx="54" cy="58" r="1.5"/><circle cx="92" cy="44" r="1"/>
    <circle cx="246" cy="52" r="1.6"/><circle cx="268" cy="84" r="1.1"/>
    <circle cx="64" cy="112" r="1"/><circle cx="232" cy="118" r="1.2"/>
    <circle cx="132" cy="48" r="1.1"/><circle cx="198" cy="42" r="1.4"/>
  </g>

        <circle cx="235" cy="96" r="34" fill="#f6e3b4" opacity="0.85"/>
        <!-- Distant village cottages -->
        <g fill="#0f1722" opacity="0.85">
          <polygon points="24,352 60,316 96,352"/><rect x="34" y="352" width="52" height="58"/>
          <polygon points="218,350 258,312 298,350"/><rect x="228" y="350" width="60" height="60"/>
          <rect x="52" y="366" width="14" height="16" fill="#f5c26b" opacity="0.85"/>
          <rect x="252" y="364" width="14" height="16" fill="#f5c26b" opacity="0.85"/>
          <rect x="14" y="388" width="292" height="40"/>
        </g>
    
        <!-- Pitchfork -->
        <g stroke="#c79e64" stroke-width="5" stroke-linecap="round" fill="none">
          <line x1="224" y1="144" x2="212" y2="392"/>
          <path d="M204 120 L206 154 Q224 166 242 154 L244 120"/>
          <line x1="224" y1="112" x2="224" y2="160"/>
        </g>
        <!-- Warm lantern -->
        <circle cx="96" cy="276" r="36" fill="#fbbf24" opacity="0.22"/>
        <rect x="86" y="256" width="20" height="30" rx="4" fill="#fef08a" stroke="#7c5321" stroke-width="3"/>
        <path d="M84 256 L96 244 L108 256 Z" fill="#7c5321"/>
        <!-- Villager silhouette & straw hat -->
        <path d="M98 394 C104 316 124 274 160 274 C196 274 216 316 222 394 Z" fill="#1e2d3f" stroke="#d9b56c" stroke-width="2"/>
        <path d="M138 278 L160 314 L182 278" fill="#d9b56c" opacity="0.3"/>
        <circle cx="160" cy="222" r="34" fill="#e6c39a"/>
        <!-- Straw hat -->
