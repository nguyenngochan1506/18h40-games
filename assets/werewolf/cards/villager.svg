        <path d="M124 196 C128 158 192 158 196 196 Z" fill="#e2b85c" stroke="#7c5321" stroke-width="2.5"/>
        <rect x="125" y="186" width="70" height="8" rx="3" fill="#8f2d2d"/>
        
    <rect x="14" y="14" width="292" height="412" fill="url(#vignette)"/>
