<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" role="img" aria-label="Kẻ Chán Đời">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29170d"/>
      <stop offset="55%" stop-color="#4a2716"/>
      <stop offset="100%" stop-color="#140b06"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#140b06" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04050a" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e0a5"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#8b6528"/>
    </linearGradient>
    <clipPath id="innerClip">
      <rect x="14" y="14" width="292" height="412" rx="14"/>
    </clipPath>
  </defs>

  <rect width="320" height="440" rx="18" fill="#090b12"/>
  <g clip-path="url(#innerClip)">
    <rect x="14" y="14" width="292" height="412" fill="url(#bg)"/>
    <rect x="14" y="14" width="292" height="412" fill="url(#aura)"/>
    
  <g fill="#f5e7c4" opacity="0.7">
    <circle cx="54" cy="58" r="1.5"/><circle cx="92" cy="44" r="1"/>
    <circle cx="246" cy="52" r="1.6"/><circle cx="268" cy="84" r="1.1"/>
    <circle cx="64" cy="112" r="1"/><circle cx="232" cy="118" r="1.2"/>
    <circle cx="132" cy="48" r="1.1"/><circle cx="198" cy="42" r="1.4"/>
  </g>

        <!-- Bleak copper moon -->
        <circle cx="160" cy="144" r="64" fill="#c2410c" opacity="0.55"/>
        <!-- Gallows frame silhouette -->
        <g fill="#120905">
          <rect x="64" y="96" width="16" height="314"/>
          <rect x="64" y="96" width="146" height="16"/>
          <polygon points="80,148 118,112 104,112 80,134"/>
          <rect x="14" y="388" width="292" height="40"/>
        </g>
    
        <!-- Braided Rope & Noose -->
        <line x1="176" y1="112" x2="176" y2="232" stroke="#d9a959" stroke-width="6"/>
        <g fill="#b47b32" stroke="#451a03" stroke-width="1.5">
          <rect x="167" y="218" width="18" height="7" rx="3"/>
          <rect x="167" y="226" width="18" height="7" rx="3"/>
          <rect x="167" y="234" width="18" height="7" rx="3"/>
          <rect x="167" y="242" width="18" height="7" rx="3"/>
        </g>
        <ellipse cx="176" cy="296" rx="34" ry="48" fill="none" stroke="#d9a959" stroke-width="7"/>
        <!-- Grim grinning mask inside -->
        <path d="M158 286 L168 294 M168 286 L158 294 M184 286 L194 294 M194 286 L184 294" stroke="#fed7aa" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M158 314 Q176 328 194 314" fill="none" stroke="#fed7aa" stroke-width="2.8" stroke-linecap="round"/>
        
    <rect x="14" y="14" width="292" height="412" fill="url(#vignette)"/>
  </g>

  <!-- Ornate gothic border -->
  <rect x="10" y="10" width="300" height="420" rx="16" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="18" y="18" width="284" height="404" rx="11" fill="none" stroke="#fb923c" stroke-width="1" stroke-opacity="0.55"/>
  <!-- Corner filigree diamonds -->
  <g fill="url(#gold)" opacity="0.9">
    <polygon points="26,26 32,20 38,26 32,32"/>
    <polygon points="282,26 288,20 294,26 288,32"/>
    <polygon points="26,414 32,408 38,414 32,420"/>
    <polygon points="282,414 288,408 294,414 288,420"/>
  </g>
</svg>
