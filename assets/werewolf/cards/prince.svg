<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" role="img" aria-label="Hoàng Tử">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1338"/>
      <stop offset="55%" stop-color="#32205e"/>
      <stop offset="100%" stop-color="#100b21"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#100b21" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04050a" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e0a5"/>
      <stop offset="50%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#8b6528"/>
    </linearGradient>
    <clipPath id="innerClip">
      <rect x="14" y="14" width="292" height="412" rx="14"/>
    </clipPath>
  </defs>

  <rect width="320" height="440" rx="18" fill="#090b12"/>
  <g clip-path="url(#innerClip)">
    <rect x="14" y="14" width="292" height="412" fill="url(#bg)"/>
    <rect x="14" y="14" width="292" height="412" fill="url(#aura)"/>
    
  <g fill="#f5e7c4" opacity="0.7">
    <circle cx="54" cy="58" r="1.5"/><circle cx="92" cy="44" r="1"/>
    <circle cx="246" cy="52" r="1.6"/><circle cx="268" cy="84" r="1.1"/>
    <circle cx="64" cy="112" r="1"/><circle cx="232" cy="118" r="1.2"/>
    <circle cx="132" cy="48" r="1.1"/><circle cx="198" cy="42" r="1.4"/>
  </g>

        <!-- Royal sunburst -->
        <circle cx="160" cy="196" r="92" fill="#f59e0b" opacity="0.16"/>
        <path d="M160 76 L160 316 M48 196 L272 196 M82 118 L238 274 M238 118 L82 274" stroke="#f6d365" stroke-width="1.2" opacity="0.28"/>
    
        <!-- Royal velvet mantle -->
        <path d="M62 414 C76 312 108 268 160 268 C212 268 244 312 258 414 Z" fill="#6b1033" stroke="#f6d365" stroke-width="2.5"/>
        <!-- Ermine collar -->
        <path d="M108 286 Q160 322 212 286 L202 264 Q160 288 118 264 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="136" cy="286" r="2.5" fill="#1e293b"/>
        <circle cx="160" cy="294" r="2.5" fill="#1e293b"/>
        <circle cx="184" cy="286" r="2.5" fill="#1e293b"/>
        <!-- Gleaming Golden Crown -->
        <path d="M84 226 L98 134 L132 178 L160 112 L188 178 L222 134 L236 226 Z" fill="url(#gold)" stroke="#92400e" stroke-width="3"/>
        <rect x="82" y="220" width="156" height="22" rx="6" fill="url(#gold)" stroke="#92400e" stroke-width="2.5"/>
        <!-- Jewels -->
        <polygon points="160,152 170,174 160,196 150,174" fill="#e11d48" stroke="#fef08a" stroke-width="1.5"/>
        <circle cx="118" cy="231" r="6" fill="#38bdf8"/>
        <circle cx="160" cy="231" r="7" fill="#e11d48"/>
        <circle cx="202" cy="231" r="6" fill="#38bdf8"/>
        
    <rect x="14" y="14" width="292" height="412" fill="url(#vignette)"/>
