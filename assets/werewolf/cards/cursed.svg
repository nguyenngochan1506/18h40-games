<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" role="img" aria-label="Kẻ Bị Nguyền">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b162e"/>
      <stop offset="55%" stop-color="#2d1e42"/>
      <stop offset="100%" stop-color="#0d0917"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#dc2626" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d0917" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04050a" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e0a5"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b6528"/>
    </linearGradient>
    <clipPath id="innerClip">
      <rect x="14" y="14" width="292" height="412" rx="14"/>
    </clipPath>
  </defs>

  <rect width="320" height="440" rx="18" fill="#090b12"/>
  <g clip-path="url(#innerClip)">
    <rect x="14" y="14" width="292" height="412" fill="url(#bg)"/>
    <rect x="14" y="14" width="292" height="412" fill="url(#aura)"/>
    
  <g fill="#f5e7c4" opacity="0.7">
    <circle cx="54" cy="58" r="1.5"/><circle cx="92" cy="44" r="1"/>
    <circle cx="246" cy="52" r="1.6"/><circle cx="268" cy="84" r="1.1"/>
    <circle cx="64" cy="112" r="1"/><circle cx="232" cy="118" r="1.2"/>
    <circle cx="132" cy="48" r="1.1"/><circle cx="198" cy="42" r="1.4"/>
  </g>

        <!-- Creeping curse runes -->
        <circle cx="160" cy="220" r="96" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="10 6" opacity="0.55"/>
        <path d="M68 158 L106 196 M252 158 L214 196 M68 292 L106 254 M252 292 L214 254" stroke="#a855f7" stroke-width="2" opacity="0.55"/>
    
        <!-- Villager figure marked by glowing wolf claw curse -->
        <path d="M84 412 C92 318 118 278 160 278 C202 278 228 318 236 412 Z" fill="#1e1b2e" stroke="#a78bfa" stroke-width="2"/>
        <circle cx="160" cy="214" r="36" fill="#2d2642" stroke="#c4b5fd" stroke-width="2"/>
        <!-- One human eye, one cursed crimson wolf eye -->
        <circle cx="146" cy="212" r="4" fill="#e2e8f0"/>
        <polygon points="184,206 168,212 180,218" fill="#ef4444"/>
        <!-- Glowing triple claw brand across chest -->
        <g stroke="#ef4444" stroke-width="6" stroke-linecap="round">
          <path d="M116 294 L182 368"/>
          <path d="M138 282 L204 356"/>
          <path d="M160 274 L222 344"/>
        </g>
        <g stroke="#fecaca" stroke-width="2" stroke-linecap="round">
          <path d="M116 294 L182 368"/>
          <path d="M138 282 L204 356"/>
          <path d="M160 274 L222 344"/>
        </g>
        
    <rect x="14" y="14" width="292" height="412" fill="url(#vignette)"/>
  </g>

  <!-- Ornate gothic border -->
  <rect x="10" y="10" width="300" height="420" rx="16" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="18" y="18" width="284" height="404" rx="11" fill="none" stroke="#c4b5fd" stroke-width="1" stroke-opacity="0.55"/>
  <!-- Corner filigree diamonds -->
  <g fill="url(#gold)" opacity="0.9">
    <polygon points="26,26 32,20 38,26 32,32"/>
    <polygon points="282,26 288,20 294,26 288,32"/>
    <polygon points="26,414 32,408 38,414 32,420"/>
    <polygon points="282,414 288,408 294,414 288,420"/>
  </g>
</svg>
