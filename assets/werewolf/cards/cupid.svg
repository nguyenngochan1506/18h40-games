<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" role="img" aria-label="Thần Tình Yêu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1026"/>
      <stop offset="55%" stop-color="#541c3c"/>
      <stop offset="100%" stop-color="#180814"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#fb7185" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#180814" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04050a" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e0a5"/>
      <stop offset="50%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#8b6528"/>
    </linearGradient>
    <clipPath id="innerClip">
      <rect x="14" y="14" width="292" height="412" rx="14"/>
    </clipPath>
  </defs>

  <rect width="320" height="440" rx="18" fill="#090b12"/>
  <g clip-path="url(#innerClip)">
    <rect x="14" y="14" width="292" height="412" fill="url(#bg)"/>
    <rect x="14" y="14" width="292" height="412" fill="url(#aura)"/>
    
  <g fill="#f5e7c4" opacity="0.7">
    <circle cx="54" cy="58" r="1.5"/><circle cx="92" cy="44" r="1"/>
    <circle cx="246" cy="52" r="1.6"/><circle cx="268" cy="84" r="1.1"/>
    <circle cx="64" cy="112" r="1"/><circle cx="232" cy="118" r="1.2"/>
    <circle cx="132" cy="48" r="1.1"/><circle cx="198" cy="42" r="1.4"/>
  </g>

        <!-- Luminous twin rings -->
        <circle cx="136" cy="216" r="56" fill="none" stroke="#fda4af" stroke-width="2" opacity="0.5"/>
        <circle cx="184" cy="216" r="56" fill="none" stroke="#fde68a" stroke-width="2" opacity="0.5"/>
    
        <!-- Angelic Golden Wings -->
        <path d="M160 220 C124 160 72 152 46 184 C74 198 84 218 60 244 C94 248 118 242 148 250 Z" fill="#fef3c7" opacity="0.88" stroke="#d97706" stroke-width="1.8"/>
        <path d="M160 220 C196 160 248 152 274 184 C246 198 236 218 260 244 C226 248 202 242 172 250 Z" fill="#fef3c7" opacity="0.88" stroke="#d97706" stroke-width="1.8"/>
        <!-- Crimson Heart -->
        <path d="M160 326 C160 326 92 276 92 224 C92 192 118 172 144 186 C153 191 158 198 160 204 C162 198 167 191 176 186 C202 172 228 192 228 224 C228 276 160 326 160 326 Z" fill="#e11d48" stroke="#fda4af" stroke-width="3"/>
        <!-- Golden Arrow piercing heart -->
        <line x1="74" y1="306" x2="246" y2="134" stroke="#fde047" stroke-width="5" stroke-linecap="round"/>
        <polygon points="256,124 226,134 246,154" fill="#fde047"/>
        <path d="M64 316 L84 296 L72 288 M64 316 L84 296 L92 308" stroke="#fda4af" stroke-width="3" fill="none"/>
        
    <rect x="14" y="14" width="292" height="412" fill="url(#vignette)"/>
  </g>

  <!-- Ornate gothic border -->
  <rect x="10" y="10" width="300" height="420" rx="16" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="18" y="18" width="284" height="404" rx="11" fill="none" stroke="#fda4af" stroke-width="1" stroke-opacity="0.55"/>
  <!-- Corner filigree diamonds -->
  <g fill="url(#gold)" opacity="0.9">
    <polygon points="26,26 32,20 38,26 32,32"/>
    <polygon points="282,26 288,20 294,26 288,32"/>
    <polygon points="26,414 32,408 38,414 32,420"/>
    <polygon points="282,414 288,408 294,414 288,420"/>
  </g>
</svg>
