        <polygon points="214,204 202,144 174,192" fill="#180d12" stroke="#fca5a5" stroke-width="1.5"/>
        <!-- Glowing eyes -->
        <polygon points="124,226 146,234 132,242" fill="#fde047"/>
        <polygon points="196,226 174,234 188,242" fill="#fde047"/>
