    <polygon points="48,426 80,335 112,426"/>
    <polygon points="212,426 244,330 276,426"/>
    <polygon points="252,426 284,308 310,426"/>
    <rect x="14" y="388" width="292" height="40"/>
  </g>

    
        <!-- Snarling Werewolf head & shoulders -->
        <path d="M68 410 C76 330 98 286 124 268 L104 202 L134 222 L160 184 L186 222 L216 202 L196 268 C222 286 244 330 252 410 Z" fill="#11090d" stroke="#ef4444" stroke-width="2.2"/>
        <!-- Ears & fur spikes -->
