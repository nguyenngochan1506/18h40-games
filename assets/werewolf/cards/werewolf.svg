<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" role="img" aria-label="Ma Sói">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b090e"/>
      <stop offset="55%" stop-color="#4d1119"/>
      <stop offset="100%" stop-color="#12060a"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
