<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" role="img" aria-label="Bảo Vệ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2238"/>
      <stop offset="55%" stop-color="#1d3d5c"/>
      <stop offset="100%" stop-color="#0a131f"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#60a5fa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a131f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04050a" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e0a5"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#8b6528"/>
    </linearGradient>
    <clipPath id="innerClip">
      <rect x="14" y="14" width="292" height="412" rx="14"/>
    </clipPath>
  </defs>

  <rect width="320" height="440" rx="18" fill="#090b12"/>
  <g clip-path="url(#innerClip)">
    <rect x="14" y="14" width="292" height="412" fill="url(#bg)"/>
    <rect x="14" y="14" width="292" height="412" fill="url(#aura)"/>
    
  <g fill="#f5e7c4" opacity="0.7">
    <circle cx="54" cy="58" r="1.5"/><circle cx="92" cy="44" r="1"/>
    <circle cx="246" cy="52" r="1.6"/><circle cx="268" cy="84" r="1.1"/>
    <circle cx="64" cy="112" r="1"/><circle cx="232" cy="118" r="1.2"/>
    <circle cx="132" cy="48" r="1.1"/><circle cx="198" cy="42" r="1.4"/>
  </g>

        <circle cx="160" cy="214" r="104" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.3"/>
        <!-- Crossed swords behind shield -->
        <g stroke="#cbd5e1" stroke-width="7" stroke-linecap="round">
          <line x1="84" y1="118" x2="236" y2="338"/>
          <line x1="236" y1="118" x2="84" y2="338"/>
        </g>
        <g stroke="#d9b56c" stroke-width="6" stroke-linecap="round">
          <line x1="72" y1="142" x2="108" y2="116"/>
          <line x1="248" y1="142" x2="212" y2="116"/>
        </g>
    
        <!-- Knight Heater Shield -->
        <path d="M90 136 L160 116 L230 136 L222 254 C218 310 192 346 160 368 C128 346 102 310 98 254 Z" fill="#1e3a5f" stroke="url(#gold)" stroke-width="5"/>
        <path d="M104 148 L160 132 L216 148 L210 250 C206 298 186 328 160 348 C134 328 114 298 110 250 Z" fill="#12263f" stroke="#93c5fd" stroke-width="1.5"/>
