        <path d="M160 156 L160 326 M118 218 L202 218" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
        <circle cx="160" cy="218" r="24" fill="#2563eb" stroke="#f6e0a5" stroke-width="3.5"/>
        <path d="M160 202 L165 213 L176 218 L165 223 L160 234 L155 223 L144 218 L155 213 Z" fill="#e0f2fe"/>
        
    <rect x="14" y="14" width="292" height="412" fill="url(#vignette)"/>
