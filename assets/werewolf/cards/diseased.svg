<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" role="img" aria-label="Người Bệnh">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142113"/>
      <stop offset="55%" stop-color="#24381c"/>
      <stop offset="100%" stop-color="#0b120a"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#84cc16" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b120a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04050a" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e0a5"/>
      <stop offset="50%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#8b6528"/>
    </linearGradient>
    <clipPath id="innerClip">
      <rect x="14" y="14" width="292" height="412" rx="14"/>
    </clipPath>
  </defs>

  <rect width="320" height="440" rx="18" fill="#090b12"/>
  <g clip-path="url(#innerClip)">
    <rect x="14" y="14" width="292" height="412" fill="url(#bg)"/>
    <rect x="14" y="14" width="292" height="412" fill="url(#aura)"/>
    
  <g fill="#f5e7c4" opacity="0.7">
    <circle cx="54" cy="58" r="1.5"/><circle cx="92" cy="44" r="1"/>
    <circle cx="246" cy="52" r="1.6"/><circle cx="268" cy="84" r="1.1"/>
    <circle cx="64" cy="112" r="1"/><circle cx="232" cy="118" r="1.2"/>
    <circle cx="132" cy="48" r="1.1"/><circle cx="198" cy="42" r="1.4"/>
  </g>

        <!-- Contagion miasma clouds -->
        <circle cx="96" cy="186" r="54" fill="#65a30d" opacity="0.22"/>
        <circle cx="222" cy="198" r="62" fill="#4d7c0f" opacity="0.24"/>
        <g fill="#bef264" opacity="0.65">
          <circle cx="78" cy="144" r="4"/><circle cx="242" cy="138" r="5"/>
          <circle cx="66" cy="276" r="3.5"/><circle cx="256" cy="264" r="4.5"/>
          <circle cx="114" cy="116" r="3"/><circle cx="212" cy="112" r="3"/>
        </g>
    
        <!-- Plague-touched figure & cracked medicine flask -->
        <path d="M84 412 C94 322 120 282 160 282 C200 282 226 322 236 412 Z" fill="#1a2917" stroke="#a3e635" stroke-width="2"/>
        <path d="M116 270 C114 196 132 158 160 154 C188 158 206 196 204 270 Z" fill="#23361e" stroke="#bef264" stroke-width="2"/>
        <!-- Wrapped scarf & feverish eyes -->
        <ellipse cx="160" cy="212" rx="28" ry="30" fill="#10180e"/>
        <circle cx="148" cy="208" r="4" fill="#d9f99d"/>
        <circle cx="172" cy="208" r="4" fill="#d9f99d"/>
        <path d="M126 238 Q160 256 194 238 L190 264 Q160 278 130 264 Z" fill="#4d7c0f" stroke="#bef264" stroke-width="1.5"/>
        <!-- Bio-toxin/apothecary emblem -->
        <circle cx="160" cy="334" r="28" fill="#14532d" stroke="#bef264" stroke-width="2.5"/>
        <circle cx="160" cy="322" r="9" fill="none" stroke="#d9f99d" stroke-width="3"/>
        <circle cx="150" cy="340" r="9" fill="none" stroke="#d9f99d" stroke-width="3"/>
        <circle cx="170" cy="340" r="9" fill="none" stroke="#d9f99d" stroke-width="3"/>
        
    <rect x="14" y="14" width="292" height="412" fill="url(#vignette)"/>
  </g>

  <!-- Ornate gothic border -->
  <rect x="10" y="10" width="300" height="420" rx="16" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="18" y="18" width="284" height="404" rx="11" fill="none" stroke="#bef264" stroke-width="1" stroke-opacity="0.55"/>
  <!-- Corner filigree diamonds -->
  <g fill="url(#gold)" opacity="0.9">
    <polygon points="26,26 32,20 38,26 32,32"/>
    <polygon points="282,26 288,20 294,26 288,32"/>
    <polygon points="26,414 32,408 38,414 32,420"/>
    <polygon points="282,414 288,408 294,414 288,420"/>
  </g>
</svg>
